name: Life Atlas checks
on:
  push:
    branches: [main, feat/life-atlas-web-game]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: life-atlas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          TEST_MODE: http
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: life-atlas-browser-tests
          path: |
            test-results/browser-report.json
            test-results/*.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: life-atlas-static-site
          path: dist/
